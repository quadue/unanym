name: Verify
on:
  push:
    branches: [main, feat/public-landing]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  code: read
concurrency:
  group: verify-${{ gitea.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Prepare the PHP verifier without changing the runner
        run: bash scripts/ci-php.sh
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify the candidate
        run: npm run verify
